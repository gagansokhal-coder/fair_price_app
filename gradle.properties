# ── Gradle JVM Settings ──
# Reduced to 1.5GB - your system has limited free RAM
# UseSerialGC uses less memory overhead than G1GC
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Kotlin Daemon Settings ──
# Run Kotlin compiler in-process to avoid separate daemon memory
kotlin.compiler.execution.strategy=in-process

# ── Build Performance ──
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2

# ── Android Settings ──
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
